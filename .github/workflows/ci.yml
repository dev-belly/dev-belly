name: Profile checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check graphics, project cards and local navigation
        run: python scripts/check_profile.py
      - name: Check project catalog and its source manifest
        run: python scripts/build_project_catalog.py --check
      - name: Rebuild graphics and check for uncommitted outputs
        run: |
          python scripts/build_profile_assets.py
          git diff --exit-code -- assets
          test -z "$(git ls-files --others --exclude-standard assets)"
